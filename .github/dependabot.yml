---
version: 2
updates:
  - package-ecosystem: uv
    directories:
      - /python/*
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      monthly-batch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
